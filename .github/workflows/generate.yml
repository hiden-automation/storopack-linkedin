name: Gerar posts (quando a fila acaba)

on:
  schedule:
    # Diário 08:00 BRT como garantia; também é disparado após cada aceite/recusa/publicação.
    # Só gera se houver até 3 aceitos e nenhum aguardando aprovação.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal = só gera se a fila estiver acabando | force = gera 12 agora | retry-failed = refaz posts com falha"
        type: choice
        options: [normal, force, retry-failed]
        default: normal

permissions:
  contents: write
  actions: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Gerar
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          N_POSTS: ${{ vars.N_POSTS }}
          REFILL_MAX_ACCEPTED: ${{ vars.REFILL_MAX_ACCEPTED }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: https://${{ github.repository_owner }}.github.io
        run: |
          case "${{ inputs.mode }}" in
            force) python -m storobot.generate --force ;;
            retry-failed) python -m storobot.generate --retry-failed ;;
            *) python -m storobot.generate ;;
          esac
      - name: Salvar no repositório
        if: always()
        env:
          PYTHONPATH: src
        run: |
          python -m storobot.sync save
          bash scripts/commit_push.sh "posts: geração de conteúdo" 'python -m storobot.sync merge'
      - name: Atualizar painel
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
