name: Publicar no LinkedIn (seg, qua, sex)

on:
  schedule:
    # Neste repositório o cron do GitHub dispara com 4 a 7 horas de atraso e descarta boa parte
    # das execuções. Estratégia "chegar cedo e esperar": tentativas de madrugada (0h07, 2h07 e
    # 4h07 BRT) que, ao dispararem (atrasadas) antes das 9h, aguardam até as 9h e publicam.
    - cron: "7 3,5,7 * * 1-5"
    # Tentativas extras de manhã e de tarde, caso as da madrugada sejam descartadas.
    - cron: "7,27,47 12-14 * * 1-5"
    - cron: "13 15-22 * * 1-5"
    # O script decide: só seg/qua/sex (ou recuperação de dia perdido), no máximo um post por dia.
  workflow_dispatch:
    inputs:
      force:
        description: "Ignorar dia/horário e publicar o próximo aceito agora"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Aguardar as 9h (se chegou cedo)
        # Antes do checkout, para publicar com a fila mais recente depois da espera.
        if: github.event_name == 'schedule'
        run: |
          export TZ=America/Sao_Paulo
          now=$(date +%s); nine=$(date -d "today 09:00" +%s); dow=$(date +%u)
          wait=$((nine - now))
          if [ "$dow" -le 5 ] && [ "$wait" -gt 0 ]; then
            if [ "$wait" -le 19800 ]; then
              echo "Chegou às $(date +%H:%M); aguardando até 09:00 ($((wait / 60)) min)"
              sleep "$wait"
            else
              echo "Chegou cedo demais ($(date +%H:%M)); outra tentativa publica mais tarde"
            fi
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publicar
        env:
          PYTHONPATH: src
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_TOKEN_CREATED_AT: ${{ vars.LINKEDIN_TOKEN_CREATED_AT }}
          POST_WINDOW_START: ${{ vars.POST_WINDOW_START }}
          POST_WINDOW_END: ${{ vars.POST_WINDOW_END }}
          POST_WEEKDAYS: ${{ vars.POST_WEEKDAYS }}
          TOKEN_WARNING_FILE: ${{ runner.temp }}/token_warning
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: https://${{ github.repository_owner }}.github.io
        run: python -m storobot.post ${{ inputs.force && '--force' || '' }}
      - name: Avisar que o token do LinkedIn vai expirar
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="${{ runner.temp }}/token_warning"
          [ -f "$f" ] || exit 0
          title="Renovar token do LinkedIn"
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number -q '.[].number')" ]; then
            gh issue create --title "$title" --body "O token do LinkedIn expira em $(cat "$f") dia(s). Rode \`python scripts/linkedin_auth.py --set-secrets\` na sua máquina."
          fi
      - name: Salvar no repositório
        if: always()
        env:
          PYTHONPATH: src
        run: |
          python -m storobot.sync save
          bash scripts/commit_push.sh "posts: publicação no LinkedIn" 'python -m storobot.sync merge'
      - name: Repor posts se a fila estiver acabando
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run generate.yml --ref main
      - name: Atualizar painel
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
