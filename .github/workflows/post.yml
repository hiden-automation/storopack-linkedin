name: Publicar no LinkedIn (a cada 3 dias)

on:
  schedule:
    - cron: "0 13 * * *" # diário 10:00 BRT; o script só posta se já passaram 3 dias
  workflow_dispatch:
    inputs:
      force:
        description: "Ignorar o intervalo de 3 dias e publicar o próximo aceito agora"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publicar
        env:
          PYTHONPATH: src
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_TOKEN_CREATED_AT: ${{ vars.LINKEDIN_TOKEN_CREATED_AT }}
          TOKEN_WARNING_FILE: ${{ runner.temp }}/token_warning
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m storobot.post ${{ inputs.force && '--force' || '' }}
      - name: Avisar que o token do LinkedIn vai expirar
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="${{ runner.temp }}/token_warning"
          [ -f "$f" ] || exit 0
          title="Renovar token do LinkedIn"
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number -q '.[].number')" ]; then
            gh issue create --title "$title" --body "O token do LinkedIn expira em $(cat "$f") dia(s). Rode \`python scripts/linkedin_auth.py --set-secrets\` na sua máquina."
          fi
      - name: Salvar no repositório
        if: always()
        run: |
          bash scripts/commit_push.sh "posts: publicação no LinkedIn"

  pages:
    needs: post
    if: always()
    uses: ./.github/workflows/pages.yml
