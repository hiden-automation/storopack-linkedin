name: Publicar no LinkedIn (a cada 3 dias)

on:
  schedule:
    # Seg–sex às 10:00 e 14:00 BRT (a das 14h é reserva caso a das 10h atrase/falhe).
    # O script só posta se já passaram 3 dias e se está na janela 8h–18h de dia útil.
    - cron: "0 13,17 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignorar o intervalo de 3 dias e a janela de horário e publicar o próximo aceito agora"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publicar
        env:
          PYTHONPATH: src
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_TOKEN_CREATED_AT: ${{ vars.LINKEDIN_TOKEN_CREATED_AT }}
          POST_WINDOW_START: ${{ vars.POST_WINDOW_START }}
          POST_WINDOW_END: ${{ vars.POST_WINDOW_END }}
          POST_ON_WEEKENDS: ${{ vars.POST_ON_WEEKENDS }}
          TOKEN_WARNING_FILE: ${{ runner.temp }}/token_warning
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m storobot.post ${{ inputs.force && '--force' || '' }}
      - name: Avisar que o token do LinkedIn vai expirar
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="${{ runner.temp }}/token_warning"
          [ -f "$f" ] || exit 0
          title="Renovar token do LinkedIn"
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number -q '.[].number')" ]; then
            gh issue create --title "$title" --body "O token do LinkedIn expira em $(cat "$f") dia(s). Rode \`python scripts/linkedin_auth.py --set-secrets\` na sua máquina."
          fi
      - name: Salvar no repositório
        if: always()
        run: |
          bash scripts/commit_push.sh "posts: publicação no LinkedIn"

  pages:
    needs: post
    if: always()
    uses: ./.github/workflows/pages.yml
