name: Inscrever aparelho nas notificações

run-name: "Inscrição de notificações"

on:
  workflow_dispatch:
    inputs:
      subscription:
        description: "JSON da inscrição Web Push (enviado pelo painel)"
        required: true

permissions:
  contents: write

jobs:
  subscribe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
      SUBSCRIPTION: ${{ inputs.subscription }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: https://${{ github.repository_owner }}.github.io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Salvar inscrição
        run: python -m storobot.notify subscribe "$SUBSCRIPTION"
      - name: Salvar no repositório
        run: |
          bash scripts/commit_push.sh "notificações: novo aparelho" 'python -m storobot.notify subscribe "$SUBSCRIPTION"'
