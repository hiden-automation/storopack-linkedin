name: Alterar status do post

run-name: "Post ${{ inputs.post_id }} → ${{ inputs.status }}"

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "ID do post (ex.: 001-03)"
        required: true
      status:
        description: "Novo status"
        type: choice
        options: [accepted, rejected, pending]
        required: true

permissions:
  contents: write
  actions: write

jobs:
  set-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
      POST_ID: ${{ inputs.post_id }}
      STATUS: ${{ inputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Alterar status
        run: python -m storobot.set_status "$POST_ID" "$STATUS"
      - name: Salvar no repositório
        run: |
          bash scripts/commit_push.sh "post $POST_ID -> $STATUS" 'python -m storobot.set_status "$POST_ID" "$STATUS"'
      - name: Publicar já, se estiver na hora
        # O post.yml só publica se for seg/qua/sex entre 9h e 12h e ainda não houve post hoje
        if: inputs.status == 'accepted'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run post.yml --ref main
      - name: Repor posts se a fila estiver acabando
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run generate.yml --ref main
      - name: Atualizar painel
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
